url: https://ndohpenngit.github.io/bayprior/

project:
  type: website
  output-dir: docs
  resources:
    - man/figures/favicon.png
  render:
    - "*.qmd"
    - "vignettes/*.Rmd"
    - "NEWS.md"
    - "cheatsheet/*.html"
    - "!inst/**"

execute:
  freeze: auto

website:
  title: "bayprior"
  description: "Bayesian Prior Elicitation for Clinical Trials"
  favicon: man/figures/favicon.png
  repo-url: https://github.com/ndohpenngit/bayprior
  repo-actions: [issue]
  navbar:
    logo: man/figures/favicon.png
    title: "bayprior"
    left:
      - href: index.qmd
        text: Home
      - href: vignettes/bayprior-introduction.Rmd
        text: Get Started
      - text: Vignettes
        menu:
          - href: vignettes/prior-elicitation.Rmd
            text: Prior Elicitation
          - href: vignettes/conflict-diagnostics.Rmd
            text: Conflict Diagnostics
          - href: vignettes/sensitivity-analysis.Rmd
            text: Sensitivity Analysis
          - href: vignettes/robust-priors.Rmd
            text: Robust Priors
          - href: vignettes/regulatory-reporting.Rmd
            text: Regulatory Reporting
      - href: NEWS.md
        text: Changelog
      - href: cheatsheet/bayprior_cheatsheet.html
        text: Cheat Sheet
    right:
      - icon: github
        href: https://github.com/ndohpenngit/bayprior

format:
  html:
    theme: flatly
    toc: true

name: Bug report
description: Report a bug in bayprior (R functions or Shiny app)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in as much detail as possible.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where does the bug occur?
      options:
        - Prior Elicitation (R function)
        - Expert Pooling (R function)
        - Conflict Diagnostics (R function)
        - Sensitivity Analysis (R function)
        - Robust / Sceptical / Power Prior (R function)
        - MAP Prior from Historical Trials (map_prior())
        - Report Generation (prior_report)
        - Shiny app -- Prior Elicitation module
        - Shiny app -- Expert Pooling module
        - Shiny app -- Conflict Diagnostics module
        - Shiny app -- Sensitivity Analysis module
        - Shiny app -- Robust Priors module
        - Shiny app -- Export Report module
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong? What did you expect to happen?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: reprex
    attributes:
      label: Reproducible example
      description: Paste a minimal reproducible example. Use reprex::reprex() if possible.
      render: r
      placeholder: |
        library(bayprior)

        prior <- elicit_beta(mean = 0.3, sd = 0.1, method = "moments")
        # error occurs here...
    validations:
      required: false

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Paste the full error message or warning.
      render: text
    validations:
      required: false

  - type: input
    id: bayprior_version
    attributes:
      label: bayprior version
      placeholder: "e.g. 0.3.2 -- check with packageVersion('bayprior')"
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Install source
      description: >-
        Where did this version come from? A dev version installed from
        GitHub main can behave differently from the released CRAN version,
        and different branches/commits can carry different code even at the
        same version number.
      options:
        - CRAN (install.packages)
        - GitHub main (pak::pak / devtools::install_github, no @ref)
        - GitHub, specific branch or tag (name it in Description below)
        - GitHub, specific commit SHA (name it in Description below)
        - Local source / package under active development
    validations:
      required: true

  - type: checkboxes
    id: restart_check
    attributes:
      label: Fresh session check
      description: >-
        A stale R session can make an old package version look like it's
        still loaded even after reinstalling. Please confirm before
        reporting.
      options:
        - label: >-
            I restarted R (fresh session, no packages pre-loaded) and
            confirmed packageVersion("bayprior") reports the version above
            before reproducing this bug.
    validations:
      required: true

  - type: input
    id: r_version
    attributes:
      label: R version
      placeholder: "e.g. 4.4.2 -- check with R.version.string"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - shinyapps.io (deployed app)
    validations:
      required: true

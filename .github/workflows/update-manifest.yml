on:
  push:
    branches: [main, master]
    paths:
      - 'DESCRIPTION'
      - 'R/**'
      - 'NAMESPACE'
      - 'inst/**'
  workflow_dispatch:

name: Update manifest.json

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rsconnect, any::devtools, any::usethis, local::.
          needs: check

      - name: Regenerate manifest.json
        run: rsconnect::writeManifest()
        shell: Rscript {0}

      - name: Commit manifest.json if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate manifest.json [skip ci]"
          file_pattern: manifest.json
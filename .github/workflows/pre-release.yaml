name: Pre-release checks

# Runs on every PR targeting main -- all checks must pass before merge
# The existing R-CMD-check.yaml handles continuous integration on all branches
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Non-ASCII source check ──────────────────────────────────────────────
  # Catches Unicode characters that break CRAN's LaTeX PDF generation
  # (U+2014 em dash, U+2212 minus, U+221E infinity etc.)
  non-ascii:
    name: Non-ASCII in R source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all R files are ASCII-clean
        shell: Rscript {0}
        run: |
          files <- list.files("R", pattern = "\\.R$", full.names = TRUE)
          bad   <- Filter(Negate(is.null), lapply(files, function(f) {
            lines <- readLines(f, warn = FALSE)
            hits  <- which(grepl("[^\x01-\x7F]", lines))
            if (length(hits)) list(file = basename(f), lines = hits)
          }))
          if (length(bad)) {
            for (x in bad)
              message("Non-ASCII in ", x$file, " at lines: ",
                      paste(x$lines, collapse = ", "))
            stop("Fix non-ASCII characters before releasing to main.\n",
                 "Replace em dashes with --, infinity with Inf, ",
                 "curly quotes with straight quotes.")
          }
          message("All ", length(files), " R files are ASCII-clean.")

  # ── 2. Spelling ─────────────────────────────────────────────────────────────
  # Uses inst/WORDLIST -- run spelling::update_wordlist() locally if this fails
  spelling:
    name: Spelling (en-GB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::spelling

      - name: Spell-check package
        shell: Rscript {0}
        run: |
          errors <- spelling::spell_check_package(use_wordlist = TRUE)
          if (nrow(errors) > 0) {
            print(errors)
            stop("Spelling errors found. Run spelling::update_wordlist() ",
                 "locally to add new terms to inst/WORDLIST, then commit.")
          }
          message("No spelling errors.")

  # ── 3. Test coverage ─────────────────────────────────────────────────────────
  # Shiny modules excluded (cannot be measured by covr)
  coverage:
    name: Test coverage (>= 70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::DT

      - name: Measure package coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(
            line_exclusions = c(
              "R/app_server.R",     "R/app_ui.R",        "R/run_app.R",
              "R/prior_report.R",   "R/mod_elicitation.R","R/mod_pooling.R",
              "R/mod_conflict.R",   "R/mod_report.R",    "R/mod_robust_priors.R",
              "R/mod_roulette.R",   "R/mod_sensitivity.R","R/mod_welcome.R"
            )
          )
          pct <- covr::percent_coverage(cov)
          message("Coverage: ", round(pct, 1), "%")
          if (pct < 70)
            stop("Coverage ", round(pct, 1), "% is below the 70% threshold.")

  # ── 4. CRAN tarball verification ─────────────────────────────────────────────
  # Builds the submission tarball and verifies:
  #   build/vignette.rds  -- the prebuilt vignette index checked by CRAN QC.R
  #   inst/doc/*.html     -- vignette outputs
  #   tarball size < 5 MB
  cran-tarball:
    name: CRAN tarball (vignette.rds + size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::knitr, any::rmarkdown

      - name: Verify build/ is not excluded from tarball
        shell: Rscript {0}
        run: |
          rbi <- readLines(".Rbuildignore", warn = FALSE)
          if (any(grepl("build", rbi))) {
            matching <- rbi[grepl("build", rbi)]
            message("WARNING: .Rbuildignore contains 'build' pattern(s):")
            message(paste(" ", matching, collapse = "\n"))
            stop("^build$ must NOT be in .Rbuildignore.\n",
                 "build/vignette.rds is the prebuilt vignette index.\n",
                 "Remove it from .Rbuildignore before releasing.")
          }
          message("PASS: build/ is not excluded from tarball.")

      - name: Build CRAN tarball (R CMD build)
        run: R CMD build .

      - name: Verify tarball contents
        run: |
          TARBALL=$(ls *.tar.gz | sort -V | tail -1)
          echo "Tarball: $TARBALL"

          SIZE_KB=$(du -k "$TARBALL" | cut -f1)
          SIZE_MB=$(echo "scale=2; $SIZE_KB/1024" | bc)
          echo "Size: ${SIZE_MB} MB"

          echo ""
          echo "--- build/ contents ---"
          tar -tzf "$TARBALL" | grep "^[^/]*/build/" || echo "(none)"

          echo ""
          echo "--- inst/doc/ contents ---"
          tar -tzf "$TARBALL" | grep "inst/doc" || echo "(none)"

          # Critical check: build/vignette.rds must be present
          if tar -tzf "$TARBALL" | grep -q "build/vignette.rds"; then
            echo ""
            echo "PASS: build/vignette.rds present (prebuilt vignette index)"
          else
            echo ""
            echo "FAIL: build/vignette.rds missing from tarball"
            echo ""
            echo "This will cause the CRAN pre-check NOTE:"
            echo "  'Package has a VignetteBuilder field but no prebuilt vignette index'"
            echo ""
            echo "Fix: ensure ^build$ is NOT in .Rbuildignore"
            exit 1
          fi

          # Size check
          if [ "$SIZE_KB" -gt 5120 ]; then
            echo "FAIL: Tarball ${SIZE_MB}MB exceeds CRAN 5MB limit"
            exit 1
          fi
          echo "PASS: Size ${SIZE_MB}MB is within CRAN limit"

      - name: Upload verified tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cran-submission-tarball
          path: "*.tar.gz"
          retention-days: 14
          if-no-files-found: error